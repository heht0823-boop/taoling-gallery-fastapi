[project]
name = "taoling-gallery-fastapi"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.112",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncmy>=0.2",
    "httpx>=0.27",
    "aiofiles>=24.1",
    "Pillow>=10.4",
    "pillow-avif-plugin>=1.4",
    "python-multipart>=0.0",
    "PyJWT>=2.9",
    "bcrypt>=4.2"
]

[project.optional-dependencies]
dev = [
    "alembic>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
